services:
  rclone-nfs:
    build:
      context: .
      args:
        RCLONE_REF: master
    image: rclone-nfs:latest
    container_name: rclone-nfs
    # Host networking is the path of least resistance: rclone serves both NFS
    # and MOUNT on TCP/2049 and rpcbind sits on 111. Bridge mode requires
    # publishing both ports and works as long as clients can reach the host.
    network_mode: host
    # The container's rpcbind needs to bind privileged port 111. Use
    # --privileged if SYS_ADMIN is rejected by your host's seccomp/apparmor.
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./config:/config
      - rclone-cache:/var/cache/rclone
    # Edit this for your remote (and optional buckets). One bucket is served
    # directly (no ListBuckets needed); two or more uses an --include filter.
    #   command: ["S3:bucket-a:bucket-b"]
    command: ["S3:my-bucket"]
    restart: unless-stopped

volumes:
  rclone-cache:
